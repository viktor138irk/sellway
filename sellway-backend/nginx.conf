# /etc/nginx/sites-available/sellway.pro
# FastPanel: вставь в конфиг сайта sellway.pro

server {
    listen 80;
    listen [::]:80;
    server_name sellway.pro www.sellway.pro;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sellway.pro www.sellway.pro;

    # SSL (FastPanel выставляет автоматически через Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/sellway.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sellway.pro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Frontend (React static build) ─────────────────
    # Если в FastPanel корневая директория сайта другая, замени путь ниже
    # или используй SITE_ROOT при запуске scripts/install.sh.
    root /var/www/sellway.pro/sellway-frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Кеширование статики
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Backend API ────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        # Rate limit API
        limit_req zone=api burst=20 nodelay;
    }

    # ── WebSocket для чата заказов ───────────────────
    location /ws/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
    }

    # ── Uploads ───────────────────────────────────────
    location /uploads/ {
        alias /var/www/sellway.pro/sellway-backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        # Запрет выполнения скриптов
        location ~* \.(php|py|js|sh)$ { deny all; }
    }

    # ── Health check ──────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:3001;
        access_log off;
    }

    # Лимиты
    client_max_body_size 10M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}

# Rate limit zone (добавь в http{} блок nginx.conf)
# limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
